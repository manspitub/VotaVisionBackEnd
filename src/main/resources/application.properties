spring.application.name=VotaVision
server.port=8080
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/survey?useSSL=false&allowPublicKeyRetrieval=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.datasource.username=survey
spring.datasource.password=survey
spring.jpa.show-sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
server.error.include-message=always

brevo.api-key=${BREVO_API_KEY:local-brevo-api-key}
brevo.sender-name=${BREVO_SENDER_NAME:VotaVision}
brevo.sender-email=${BREVO_SENDER_EMAIL:info.votavision@gmail.com}
brevo.timeout-ms=${BREVO_TIMEOUT_MS:10000}
spring.jackson.time-zone=Europe/Madrid

jwt.secret=${JWT_SECRET:local-development-secret-change-me}
jwt.duration=3600
app.frontend-base-url=http://localhost:4200
cors.allowed-origins=http://localhost:4200
