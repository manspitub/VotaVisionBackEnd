spring.application.name=VotaVision
server.port=${PORT:8080}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
server.error.include-message=always

resend.api-key=${RESEND_API_KEY}
resend.from=${RESEND_FROM}
resend.reply-to=${RESEND_REPLY_TO:info.votavision@gmail.com}
resend.timeout-ms=${RESEND_TIMEOUT_MS:10000}
spring.jackson.time-zone=Europe/Madrid

jwt.secret=${JWT_SECRET}
jwt.duration=${JWT_DURATION_SECONDS:3600}
app.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:4200}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
